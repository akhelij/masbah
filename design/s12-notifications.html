<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7490">
<title>Pissina · Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ════════ PISSINA TOKENS — identical to S1 ════════ */
:root{
  --aqua-50:#ECFEFF;--aqua-100:#CFF7FB;--aqua-200:#A4ECF5;--aqua-300:#6FDDED;--aqua-400:#22D3EE;--aqua-500:#06B6D4;--aqua-600:#0891B2;--aqua-700:#0E7490;--aqua-800:#155E75;--aqua-900:#164E63;
  --ink-strong:#0A2D38;--ink:#0F3D4C;--ink-muted:#4F6E78;--ink-faint:#8AA2AB;
  --coral:#FB7185;--coral-deep:#F43F5E;--coral-soft:#FFE4E8;--coral-ink:#9F1239;
  --wa:#17A24E;--wa-deep:#138A42;--amber:#F59E0B;--amber-soft:#FEF3C7;--amber-ink:#92580A;
  --success:#15A24A;--success-soft:#DCFCE7;--danger:#DC2626;--danger-deep:#B91C1C;--danger-soft:#FEE2E2;
  --sand:#FAFAF7;--sand-2:#F1F1EA;--white:#FFFFFF;--line:#E6E7E1;--line-2:#EDEEE8;--line-strong:#D3D6CE;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-2xl:24px;--r-3xl:32px;--r-pill:999px;
  --sh-sm:0 1px 2px rgba(15,61,76,.06),0 1px 1px rgba(15,61,76,.05);
  --sh-card:0 6px 24px -8px rgba(15,61,76,.18),0 2px 6px -3px rgba(15,61,76,.08);
  --sh-pop:0 12px 30px -8px rgba(15,61,76,.22);--sh-lg:0 22px 55px -14px rgba(15,61,76,.32);
  --grad-fab:linear-gradient(160deg,#22D3EE 0%,#0E7490 100%);
  --ease-water:cubic-bezier(.22,1,.36,1);--ease-soft:cubic-bezier(.4,0,.2,1);
  --dur-1:.18s;--dur-2:.3s;--dur-3:.5s;--focus:0 0 0 3px rgba(6,182,212,.40);
}
html{scroll-behavior:smooth;}
body{background:var(--sand);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
[hidden]{display:none!important;}
.ar{font-family:'IBM Plex Sans Arabic','Plus Jakarta Sans',sans-serif;}
::selection{background:var(--aqua-200);color:var(--ink-strong);}
.wrap{max-width:760px;margin-inline:auto;padding-inline:16px;}
@media(min-width:768px){.wrap{padding-inline:24px;}}
.t-h2{font-size:clamp(1.4rem,3.2vw,1.75rem);font-weight:800;letter-spacing:-.02em;}
.t-h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;}
.t-body{font-size:.9375rem;line-height:1.55;}.t-sm{font-size:.8125rem;line-height:1.45;}
.muted{color:var(--ink-muted);}.faint{color:var(--ink-faint);}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:700;border-radius:var(--r-pill);padding:.55rem 1rem;font-size:.88rem;line-height:1;cursor:pointer;border:1.5px solid transparent;transition:all var(--dur-1) var(--ease-soft);white-space:nowrap;min-height:42px;}
.btn:active{transform:translateY(1px);}.btn:focus-visible{outline:none;box-shadow:var(--focus);}.btn svg{width:16px;height:16px;flex:none;}
.btn-sm{padding:.4rem .75rem;font-size:.8rem;min-height:36px;}
.btn-primary{background:var(--aqua-700);color:#fff;box-shadow:var(--sh-sm);background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));}.btn-primary:hover{background-color:var(--aqua-800);}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--line-strong);}.btn-secondary:hover{border-color:var(--aqua-500);color:var(--aqua-800);background:var(--aqua-50);}
.btn-wa{background:var(--wa);color:#fff;}.btn-wa:hover{background:var(--wa-deep);}
.btn-ghost{background:transparent;color:var(--aqua-800);border:none;}.btn-ghost:hover{background:var(--aqua-50);}
.icon-btn{width:40px;height:40px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;border:none;background:var(--sand-2);color:var(--ink);cursor:pointer;flex:none;}.icon-btn svg{width:20px;height:20px;}

/* ════════ S12-specific ════════ */
.site-header{position:sticky;top:0;z-index:30;background:rgba(250,250,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.daygroup{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin:1.4rem 0 .6rem;padding-inline:.2rem;}
.nrow{position:relative;overflow:hidden;border-radius:var(--r-xl);}
.ndelete{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-inline:1.4rem;font-weight:700;gap:.4rem;font-size:.86rem;}.ndelete svg{width:18px;height:18px;}
.nitem{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);padding:.9rem;display:flex;gap:.8rem;transition:transform var(--dur-2) var(--ease-water);touch-action:pan-y;}
.nitem.unread{background:var(--aqua-50);border-color:var(--aqua-200);}
.nicon{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;flex:none;}.nicon svg{width:21px;height:21px;}
.ndot{position:absolute;top:.9rem;inset-inline-end:.9rem;width:9px;height:9px;border-radius:99px;background:var(--coral-deep);}
.ncta{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;}
.empty-ill{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 50% 38%,var(--aqua-100),var(--aqua-50));display:grid;place-items:center;color:var(--aqua-600);margin-inline:auto;}

/* lockscreen push previews */
.lock{position:relative;max-width:372px;margin-inline:auto;border-radius:34px;overflow:hidden;background:linear-gradient(170deg,#0A2D38 0%,#0E7490 50%,#155E75 100%);padding:2.2rem 1rem 1.6rem;min-height:520px;box-shadow:var(--sh-lg);}
.lock::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 80% 0%,rgba(34,211,238,.35),transparent 60%);pointer-events:none;}
.lock-time{position:relative;text-align:center;color:#fff;font-size:3.6rem;font-weight:700;letter-spacing:-.02em;line-height:1;}
.lock-date{position:relative;text-align:center;color:rgba(255,255,255,.85);font-weight:600;margin-top:.3rem;margin-bottom:1.6rem;}
.push{position:relative;display:flex;gap:.7rem;background:rgba(255,255,255,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px;padding:.75rem .85rem;box-shadow:0 6px 22px rgba(0,0,0,.22);}
.push .pi{width:38px;height:38px;border-radius:9px;background:var(--grad-fab);display:grid;place-items:center;flex:none;box-shadow:var(--sh-sm);}
.push .ptop{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--ink-muted);font-weight:600;}
.push .ptitle{font-weight:700;font-size:.9rem;margin-top:.1rem;color:var(--ink-strong);line-height:1.25;}
.push .pbody{font-size:.84rem;color:var(--ink);line-height:1.35;margin-top:.05rem;}
[dir="rtl"] .push .ptop{flex-direction:row-reverse;}

.langsw{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:999px;overflow:hidden;font-size:.84rem;font-weight:700;}
.langsw button{border:none;background:none;padding:.45rem .9rem;cursor:pointer;color:var(--ink-muted);}.langsw button.is-on{background:var(--aqua-700);color:#fff;}

/* tab bar */
.tabbar{display:flex;justify-content:space-around;align-items:flex-end;background:#fff;border-top:1px solid var(--line);padding:.45rem .4rem calc(.45rem + env(safe-area-inset-bottom));}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:.18rem;color:var(--ink-muted);font-size:.66rem;font-weight:600;padding:.25rem 0;background:none;border:none;cursor:pointer;min-height:48px;}.tab svg{width:23px;height:23px;}.tab.is-on{color:var(--aqua-700);}

.demo-btn{font-size:.78rem;font-weight:600;padding:.3rem .6rem;border-radius:999px;border:none;background:var(--sand-2);color:var(--ink-muted);cursor:pointer;}.demo-btn.is-on{background:var(--aqua-700);color:#fff;}

@media(max-width:1023px){body{padding-bottom:74px;}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
  <linearGradient id="lg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#0E7490"/></linearGradient>
</defs></svg>

<!-- header -->
<header class="site-header">
  <div class="wrap" style="display:flex;align-items:center;gap:.7rem;height:58px">
    <button class="icon-btn" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div style="flex:1"><strong style="font-size:1.05rem">Notifications</strong></div>
    <button class="btn btn-ghost btn-sm" id="markAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Tout marquer comme lu</button>
  </div>
</header>

<main class="wrap" style="padding-top:.6rem;padding-bottom:2.5rem">
  <div style="display:flex;justify-content:flex-end;margin:.6rem 0">
    <div style="display:inline-flex;align-items:center;gap:.35rem;border:1px dashed var(--line-strong);border-radius:var(--r-pill);padding:.25rem .3rem .25rem .7rem;background:#fff">
      <span style="font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)">Aperçu</span>
      <button class="demo-btn is-on" data-demo="list">Liste</button>
      <button class="demo-btn" data-demo="empty">Vide</button>
    </div>
  </div>

  <!-- notifications list (rendered) -->
  <div id="notifList"></div>

  <!-- empty state -->
  <div id="emptyState" hidden style="text-align:center;padding:3rem 1rem">
    <div class="empty-ill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="m4 4 16 16" opacity=".5"/></svg></div>
    <h2 class="t-h3" style="margin-top:1rem">Vous êtes à jour ✓</h2>
    <p class="t-body muted" style="max-width:26rem;margin:.5rem auto 0">Aucune nouvelle notification. Les demandes, confirmations et rappels apparaîtront ici.</p>
    <button class="btn btn-primary" style="margin-top:1.2rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Explorer les piscines</button>
  </div>

  <!-- ═══════════ PUSH PREVIEWS ═══════════ -->
  <section style="margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1.8rem">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem">
      <div><h2 class="t-h3">Modèles de notifications push</h2><p class="t-sm muted" style="margin-top:.2rem">Aperçu sur écran verrouillé — FR & العربية.</p></div>
      <div class="langsw" id="pushLang"><button class="is-on" data-lang="fr">FR</button><button class="ar" data-lang="ar">العربية</button></div>
    </div>
    <div class="lock">
      <div class="lock-time">9:41</div>
      <div class="lock-date" id="lockDate">samedi 18 juillet</div>
      <div id="pushList" style="display:flex;flex-direction:column;gap:.6rem"></div>
    </div>
  </section>
</main>

<!-- bottom tab bar -->
<nav class="tabbar lg:hidden" style="position:fixed;inset-inline:0;bottom:0;z-index:34;box-shadow:0 -6px 20px -12px rgba(15,61,76,.25)" aria-label="Navigation">
  <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3 6.3-2.1Z"/></svg>Explorer</button>
  <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Réservations</button>
  <button class="tab is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alertes</button>
  <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</button>
</nav>

<!-- ════════════════════════════════════════════════════════════════
     DESIGN NOTES · S12 — Notifications
     ────────────────────────────────────────────────────────────────
     • Liste groupée par jour avec types reconnaissables d'un coup d'œil (icône +
       couleur) : nouvelle demande (hôte), demande acceptée 🎉 (avec Appeler/WhatsApp),
       rappel veille de visite (itinéraire + tél hôte), demande expirée, nouvel avis,
       conseil de croissance. Les actions utiles sont DANS la notification.
     • Non-lu visible (fond aqua + point corail), balayage pour supprimer, « Tout
       marquer comme lu », et état vide « Vous êtes à jour ✓ ».
     • Modèles push (écran verrouillé) bilingues FR / العربية pour les 4 événements
       clés — WhatsApp et paiement sur place rappelés, RTL natif pour l'arabe.
     • Tokens/composants S1 réutilisés à l'identique ; liste et push rendus depuis
       des données.
     ════════════════════════════════════════════════════════════════ -->
<script>
const $=id=>document.getElementById(id);
const LOGO='<svg width="24" height="24" viewBox="0 0 32 32" fill="none"><path d="M5 19c2.2 0 2.2-2 4.4-2s2.2 2 4.4 2 2.2-2 4.4-2 2.2 2 4.4 2" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M5 23.5c2.2 0 2.2-2 4.4-2s2.2 2 4.4 2 2.2-2 4.4-2 2.2 2 4.4 2" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".6"/><circle cx="22.5" cy="10" r="3" fill="#FCD34D"/></svg>';
const sv=(p,f)=>`<svg viewBox="0 0 24 24" fill="${f||'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO={
  demande:sv('<path d="M22 12h-5l-1.5 3h-7L7 12H2"/><path d="M5.4 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.8 1.1Z"/>'),
  acceptee:sv('<path d="M20 6 9 17l-5-5"/>'),
  conseil:sv('<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/>'),
  rappel:sv('<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>'),
  avis:sv('<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>','currentColor'),
  expiree:sv('<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>'),
};
const COL={demande:['var(--aqua-50)','var(--aqua-700)'],acceptee:['var(--success-soft)','var(--success)'],conseil:['var(--coral-soft)','var(--coral-deep)'],rappel:['var(--amber-soft)','var(--amber-ink)'],avis:['var(--amber-soft)','var(--amber)'],expiree:['var(--sand-2)','var(--ink-muted)']};
const WA='<a class="btn btn-wa btn-sm" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.02z"/></svg>WhatsApp</a>';
const CALL='<a class="btn btn-secondary btn-sm" href="tel:#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.1 4.18 2 2 0 0 1 5.1 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>Appeler</a>';

const GROUPS=[
 {day:"Aujourd'hui",items:[
   {type:'demande',unread:1,time:'Il y a 2 h',title:'Nouvelle demande de réservation',body:'Karim B. souhaite réserver « Villa avec piscine chauffée » — sam. 18 juil. · Après-midi · 8 invités.',cta:'<button class="btn btn-primary btn-sm">Voir la demande</button>'},
   {type:'acceptee',unread:1,time:'Il y a 5 h',title:'Demande acceptée 🎉',body:'Yasmine a accepté votre demande ! Rendez-vous le 18 juil. — paiement en espèces sur place.',cta:CALL+WA},
   {type:'conseil',unread:0,time:'Ce matin',title:'Boostez votre annonce',body:'Ajoutez 3 photos lumineuses à « Piscine du jardin » pour recevoir jusqu’à 3× plus de demandes.',cta:'<button class="btn btn-secondary btn-sm">Compléter l’annonce</button>'},
 ]},
 {day:'Hier',items:[
   {type:'rappel',unread:0,time:'Hier · 18:00',title:'Votre visite, c’est demain',body:'Rappel : Villa avec piscine chauffée, demain à 15h. Rue des Jardins 12, Dar Bouazza.',cta:'<button class="btn btn-secondary btn-sm">🗺️ Itinéraire</button>'+CALL},
   {type:'avis',unread:0,time:'Hier · 11:20',title:'Nouvel avis reçu',body:'Imane K. a laissé un avis 5★ sur « Villa avec piscine chauffée ».',cta:'<button class="btn btn-secondary btn-sm">Voir l’avis</button>'},
 ]},
 {day:'Cette semaine',items:[
   {type:'expiree',unread:0,time:'Lun. · 09:10',title:'Demande expirée',body:'Votre demande pour « Grande piscine familiale » a expiré — l’hôte n’a pas répondu à temps.',cta:'<button class="btn btn-secondary btn-sm">Renvoyer la demande</button>'},
 ]},
];
function renderNotifs(){
  $('notifList').innerHTML=GROUPS.map(g=>`<div class="daygroup">${g.day}</div>`+g.items.map(it=>{
    const c=COL[it.type];
    return `<div class="nrow" style="margin-bottom:.6rem"><div class="ndelete">Supprimer ${sv('<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>')}</div>
    <div class="nitem ${it.unread?'unread':''}">
      <span class="nicon" style="background:${c[0]};color:${c[1]}">${ICO[it.type]}</span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;gap:.5rem;align-items:baseline"><strong style="font-size:.92rem">${it.unread?'<span style="display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--coral-deep);margin-inline-end:.4rem"></span>':''}${it.title}</strong><span class="t-sm faint" style="flex:none">${it.time}</span></div>
        <p class="t-sm" style="margin-top:.2rem;color:var(--ink-muted)">${it.body}</p>
        ${it.cta?`<div class="ncta">${it.cta}</div>`:''}
      </div>
    </div></div>`;
  }).join('')).join('');
}
renderNotifs();

/* swipe to dismiss */
(function(){const L=$('notifList');let sx=null,cur=null,dx=0;
  L.addEventListener('pointerdown',e=>{const it=e.target.closest('.nitem');if(it&&!e.target.closest('button')&&!e.target.closest('a')){sx=e.clientX;cur=it;dx=0;it.style.transition='none';}});
  L.addEventListener('pointermove',e=>{if(cur==null)return;dx=Math.min(0,e.clientX-sx);cur.style.transform=`translateX(${dx}px)`;});
  function end(){if(cur==null)return;cur.style.transition='';if(dx<-100){const row=cur.closest('.nrow');row.style.transition='opacity .25s';cur.style.transition='transform .25s';cur.style.transform='translateX(-110%)';row.style.opacity='0';setTimeout(()=>row.remove(),260);}else{cur.style.transform='';}sx=cur=null;dx=0;}
  L.addEventListener('pointerup',end);L.addEventListener('pointercancel',end);
})();

/* mark all read */
$('markAll').addEventListener('click',()=>{GROUPS.forEach(g=>g.items.forEach(i=>i.unread=0));renderNotifs();});

/* demo list / empty */
document.querySelectorAll('.demo-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.demo-btn').forEach(x=>x.classList.toggle('is-on',x===b));
  const empty=b.dataset.demo==='empty';$('notifList').hidden=empty;$('emptyState').hidden=!empty;
}));

 {time:{fr:'il y a 5 min',ar:'قبل 5 دقائق'},fr:{t:'Demande acceptée 🎉',b:'Yasmine a accepté ! Paiement sur place le 18 juil. Écrivez-lui sur WhatsApp.'},ar:{t:'تم قبول طلبك 🎉',b:'وافقت ياسمين! الدفع نقدًا يوم 18 يوليوز. راسلها عبر واتساب.'}},
 {time:{fr:'il y a 1 h',ar:'قبل ساعة'},fr:{t:'Votre visite, c’est demain ⏰',b:'Villa avec piscine chauffée — demain 15h · Dar Bouazza. Itinéraire disponible.'},ar:{t:'زيارتك غدًا ⏰',b:'فيلا بمسبح مدفّأ — غدًا 15:00 · دار بوعزة. الاتجاهات متاحة.'}},

];
function renderPush(lang){
  const rtl=lang==='ar';
  $('lockDate').textContent=rtl?'السبت 18 يوليوز':'samedi 18 juillet';
  $('lockDate').className='lock-date'+(rtl?' ar':'');$('lockDate').dir=rtl?'rtl':'ltr';
  $('pushList').innerHTML=PUSH.map(p=>{const x=p[lang];return `<div class="push ${rtl?'ar':''}" ${rtl?'dir="rtl"':''}><span class="pi">${LOGO}</span><div style="flex:1;min-width:0"><div class="ptop"><strong style="color:var(--ink-strong);letter-spacing:.03em">PISSINA</strong><span>· ${p.time[lang]}</span></div><div class="ptitle">${x.t}</div><div class="pbody">${x.b}</div></div></div>`;}).join('');
}
document.querySelectorAll('#pushLang button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#pushLang button').forEach(x=>x.classList.toggle('is-on',x===b));renderPush(b.dataset.lang);}));
